name: Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CREATE_LATEST: 6.0.10-281
  EMI_LATEST: 1.1.24+1.21.1
  CREATE_VERSIONS: 6.0.7-159 6.0.8-169 6.0.9-216 6.0.10-281
  EMI_VERSIONS: 1.1.13+1.21.1 1.1.14+1.21.1 1.1.15+1.21.1 1.1.16+1.21.1 1.1.17+1.21.1 1.1.18+1.21.1 1.1.19+1.21.1 1.1.20+1.21.1 1.1.21+1.21.1 1.1.22+1.21.1 1.1.23+1.21.1 1.1.24+1.21.1

jobs:
  compile-matrix:
    name: Compile against every supported dependency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Warm up the NeoForge artifacts
        run: ./gradlew compileJava

      - name: Compile matrix
        run: |
          fail=0
          {
            echo "| Create | EMI | Result |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          run_case() {
            if ./gradlew compileJava -Pcreate_version="$1" -Pemi_version="$2" -q > case.log 2>&1; then
              echo "| $1 | $2 | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | $2 | :x: |" >> "$GITHUB_STEP_SUMMARY"
              echo "::group::FAILED create=$1 emi=$2"
              grep -E "error:|Could not (find|resolve)" case.log | head -20
              echo "::endgroup::"
              fail=1
            fi
          }

          for create in $CREATE_VERSIONS; do run_case "$create" "$EMI_LATEST"; done
          for emi in $EMI_VERSIONS; do run_case "$CREATE_LATEST" "$emi"; done

          exit $fail

  client-bounds:
    name: Apply mixins on Create ${{ matrix.create }} / EMI ${{ matrix.emi }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        create: [ 6.0.7-159, 6.0.10-281 ]
        emi: [ 1.1.13+1.21.1, 1.1.24+1.21.1 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install a headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa

      - name: Run the client self-check
        shell: bash
        run: |
          xvfb-run -a ./gradlew runClient \
            -Pcreate_version=${{ matrix.create }} \
            -Pemi_version=${{ matrix.emi }} \
            -PselfCheck=true \
            -Dmixin.checks=true \
            -Dmixin.debug.verify=true 2>&1 | tee client.log

      - name: Report the self-check
        if: always()
        run: |
          grep -E "\[self-check\]" client.log || true
          if grep -qE "\[self-check\] FAILED" client.log; then
            exit 1
          fi

      - name: Upload the client log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-log-${{ matrix.create }}-${{ matrix.emi }}
          path: client.log
