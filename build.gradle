plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

def resolvedVersion = (System.getenv('MOD_VERSION') ?: mod_version).replaceFirst(/^v/, '')

version = resolvedVersion
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.blamejared.com' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'emicreatecompat.selfCheck', providers.gradleProperty('selfCheck').getOrElse('false')
        }

        clientWithJei {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'emicreatecompat.selfCheck', providers.gradleProperty('selfCheck').getOrElse('false')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


configurations {
    jeiMod {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"

    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"

    jeiMod "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

var installJeiMod = tasks.register("installJeiMod", Copy) {
    from configurations.jeiMod
    into file('run/mods')
}

var removeJeiMod = tasks.register("removeJeiMod", Delete) {
    delete fileTree('run/mods') { include 'jei-*.jar' }
}

tasks.named("prepareClientWithJeiRun") {
    dependsOn installJeiMod
    mustRunAfter removeJeiMod
}

tasks.named("prepareClientRun") {
    dependsOn removeJeiMod
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : resolvedVersion,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
